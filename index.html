<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>음성인식 프롬프터</title>
    <style>
        body {
            background-color: #111;
            color: #fff;
            font-family: 'Malgun Gothic', sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 { font-size: 24px; margin-bottom: 10px; }
        .controls {
            margin-bottom: 20px;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            margin: 0 5px;
        }
        button.stop { background-color: #dc3545; }
        #status {
            margin-top: 10px;
            font-size: 14px;
            color: #aaa;
        }
        /* 프롬프터 화면 스타일 */
        .prompter-container {
            width: 100%;
            max-width: 800px;
            height: 400px;
            background-color: #222;
            border: 2px solid #444;
            border-radius: 10px;
            overflow-y: auto;
            padding: 40px;
            box-sizing: border-box;
            position: relative;
        }
        #script-text {
            font-size: 32px;
            line-height: 1.8;
            white-space: pre-wrap;
        }
        .highlight {
            color: #ffc107;
            background-color: rgba(255, 193, 7, 0.1);
        }
    </style>
</head>
<body>

    <h1>🎤 음성인식 스마트 프롬프터</h1>
    
    <div class="controls">
        <button id="start-btn" onclick="startPrompter()">시작하기</button>
        <button id="stop-btn" class="stop" onclick="stopPrompter()" disabled>정지</button>
        <div id="status">상태: 대기 중</div>
    </div>

    <div class="prompter-container" id="prompter-box">
        <div id="script-text">여기에 읽을 대본을 입력하거나 수정하세요. 

오늘은 음성 인식을 활용한 스마트 프롬프트 테스트를 진행하고 있습니다. 
마이크를 향해 이 글을 차근차근 읽어보세요. 
말하는 속도에 맞춰 화면이 자동으로 아래로 스크롤됩니다. 
웹 브라우저의 음성 인식 기능을 활용하여 별도의 프로그램 설치 없이 태블릿이나 PC에서 간편하게 사용할 수 있습니다. 
열심히 연습해서 멋진 발표나 촬영을 완성해 보세요!</div>
    </div>

    <script>
        const scriptElement = document.getElementById('script-text');
        const prompterBox = document.getElementById('prompter-box');
        const statusDiv = document.getElementById('status');
        const startBtn = document.getElementById('start-btn');
        const stopBtn = document.getElementById('stop-btn');

        let rawText = scriptElement.innerText;
        let recognition = null;
        let isRunning = false;

        // Web Speech API 지원 확인
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        
        if (!SpeechRecognition) {
            alert('이 브라우저는 음성 인식을 지원하지 않습니다. 크롬(Chrome) 브라우저를 사용해 주세요.');
        } else {
            recognition = new SpeechRecognition();
            recognition.continuous = true; // 계속 듣기
            recognition.interimResults = true; // 실시간 결과 반환
            recognition.lang = 'ko-KR'; // 한국어 설정

            recognition.onresult = function(event) {
                let currentTranscript = '';
                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    currentTranscript += event.results[i][0].transcript;
                }
                
                statusDiv.innerText = `인식된 음성: "${currentTranscript.trim()}"`;
                
                // 대본에서 인식된 단어의 위치를 찾아 스크롤 이동
                highlightAndScroll(currentTranscript.trim());
            };

            recognition.onerror = function(event) {
                console.error('음성 인식 에러:', event.error);
                statusDiv.innerText = `에러 발생: ${event.error}`;
            };

            recognition.onend = function() {
                if (isRunning) {
                    recognition.start(); // 꺼지면 자동으로 다시 시작 (연속 유지)
                }
            };
        }

        function startPrompter() {
            if (!recognition) return;
            try {
                recognition.start();
                isRunning = true;
                startBtn.disabled = true;
                stopBtn.disabled = false;
                statusDiv.innerText = '상태: 음성 인식 중... 대본을 읽어주세요.';
            } catch (e) {
                console.error(e);
            }
        }

        function stopPrompter() {
            if (!recognition) return;
            isRunning = false;
            recognition.stop();
            startBtn.disabled = false;
            stopBtn.disabled = true;
            statusDiv.innerText = '상태: 정지됨';
        }

        function highlightAndScroll(spokenText) {
            // 간단하게 인식된 텍스트가 대본에 포함되어 있다면 해당 위치로 스크롤 이동
            const cleanSpoken = spokenText.replace(/\s+/g, '');
            const cleanScript = rawText.replace(/\s+/g, '');
            
            let index = cleanScript.indexOf(cleanSpoken.slice(-10)); // 최근 말한 10글자 기준 매칭
            
            if (index !== -1) {
                // 비율에 맞춰 프롬프트 박스 스크롤 이동
                let scrollRatio = index / cleanScript.length;
                prompterBox.scrollTop = (prompterBox.scrollHeight - prompterBox.clientHeight) * scrollRatio;
            }
        }
    </script>
</body>
</html>
